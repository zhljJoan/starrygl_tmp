[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starrygl"
version = "0.1.0"
description = "A distributed dynamic graph learning framework based on spatio-temporal chunks."
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "torch",
]

[project.scripts]
starrygl = "starrygl.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
